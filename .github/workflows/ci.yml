name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/task-board/client/package-lock.json
            examples/typescript/package-lock.json

      - name: Build runnable C# examples
        shell: bash
        run: |
          for project in examples/csharp/*/*.csproj; do
            dotnet build "$project" --configuration Release
          done

      - name: Test layered backend
        run: dotnet test tests/TaskBoard.Tests --configuration Release

      - name: Build React client
        working-directory: apps/task-board/client
        run: |
          npm ci
          npm run build

      - name: Run TypeScript language example
        working-directory: examples/typescript
        run: |
          npm ci
          npm run build
          npm start

      - name: Check plain browser JavaScript
        run: node --check examples/browser/app.js

      - name: Build API container
        run: docker build -f apps/task-board/server/Dockerfile .
